name: Build Android APK

# Run it from your phone: GitHub app or github.com → Actions → "Build Android APK" → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare web files (www) with bundled libraries for full offline use
        run: |
          mkdir -p www/lib
          cp index.html manifest.json sw.js version.json *.png www/
          curl -fsSL -o www/lib/jszip.min.js https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          curl -fsSL -o www/lib/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js
          curl -fsSL -o www/lib/jspdf.plugin.autotable.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          { "name": "purchased-apps", "version": "1.0.0", "private": true }
          EOF
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.m9r1u5.purchasedapps",
            "appName": "Purchased Apps",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set app icon and version
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-192.png $RES/mipmap-$d/ic_launcher.png
            cp icon-192.png $RES/mipmap-$d/ic_launcher_round.png
            [ -f $RES/mipmap-$d/ic_launcher_foreground.png ] && cp icon-maskable-512.png $RES/mipmap-$d/ic_launcher_foreground.png || true
          done
          rm -rf $RES/mipmap-anydpi-v26
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PurchasedApps-v${{ steps.ver.outputs.version }}.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PurchasedApps-APK
          path: PurchasedApps-v*.apk

      - name: Publish GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: Purchased Apps v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: Install the APK on Android (allow "Install unknown apps" for your browser/Files app when asked).
          files: PurchasedApps-v*.apk
          make_latest: true
